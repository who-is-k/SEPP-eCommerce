# customer-service test config

spring:
  datasource:
    url: jdbc:h2:mem:customerdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

  # kafka off for tests
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

customer:
  kafka:
    topics:
      customer-registered: customer.registered
      customer-updated: customer.updated
      customer-deactivated: customer.deactivated

logging:
  level:
    root: WARN
    com.ecommerce.customerservice: INFO
