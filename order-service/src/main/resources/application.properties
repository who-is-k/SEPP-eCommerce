# ===== Server =====
server.port=8083
spring.application.name=order-service

# ===== H2 (in-memory, database-per-service) =====
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Kafka =====
spring.kafka.bootstrap-servers=localhost:9092

# Producer: send OrderCreatedEvent as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer: read payment.* events as JSON
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.orderservice.event.PaymentCompletedEvent
spring.kafka.consumer.properties.spring.json.type.mapping=com.ecommerce.paymentservice.infrastructure.messaging.event.PaymentCompletedEvent:com.ecommerce.orderservice.event.PaymentCompletedEvent,com.ecommerce.paymentservice.infrastructure.messaging.event.PaymentFailedEvent:com.ecommerce.orderservice.event.PaymentFailedEvent
spring.kafka.consumer.auto-offset-reset=earliest

# ===== Downstream service URLs =====
services.product-service.url=http://localhost:8082
